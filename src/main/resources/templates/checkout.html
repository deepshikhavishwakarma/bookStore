<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 80%; max-width: 600px; }
        h1 { color: #333; text-align: center; }
        /* Add more styling as needed */
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <p>Review your order details below:</p>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Item</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: right;">Quantity</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: right;">Price</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: right;">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td style="border: 1px solid #ddd; padding: 8px;">
                        <span th:text="${item.book.bookName}"></span>
                    </td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">
                        <span th:text="${item.quantity}"></span>
                    </td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">
                        <span th:text="${#numbers.formatDecimal(item.book.price, 1, 2)}"></span>
                    </td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right;">
                        <span th:text="${#numbers.formatDecimal(item.book.price * item.quantity, 1, 2)}"></span>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" style="border: 1px solid #ddd; padding: 8px; text-align: right; font-weight: bold;">Total:</td>
                    <td style="border: 1px solid #ddd; padding: 8px; text-align: right; font-weight: bold;">
                        <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}"></span>
                    </td>
                </tr>
            </tfoot>
        </table>

        <h2>Shipping Information (Basic - Expand as needed)</h2>
        <form th:action="@{/payment}" method="get">
            <div style="margin-bottom: 15px;">
               <label>Shipping Address:</label><br/>
        <textarea name="shippingAddress" required></textarea>
          </div>
            <button type="submit">Proceed to Payment</button>
        </form>

        <p><a th:href="@{/cart}">Back to Cart</a></p>
    </div>
</body>
</html>
