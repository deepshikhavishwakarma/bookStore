<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button[type="submit"],
        input[type="submit"] {
            background-color: #28a745;
            color: #fff;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button[type="submit"]:hover,
        input[type="submit"]:hover {
            background-color: #1e7e34;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f5f5f5;
            color: #333;
        }

        .total {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .actions {
            margin-top: 20px;
        }

        .actions a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .empty-cart {
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Your Shopping Cart</h1>

    <div th:if="${cartItems == null or cartItems.isEmpty()}" class="empty-cart">
        Your cart is empty. <a th:href="@{/books}">Continue Shopping</a>
    </div>

    <div th:unless="${cartItems == null or cartItems.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th>Item ID</th>
                    <th>Book Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.book.bookName}"></td> 
                    <td th:text="${#numbers.formatDecimal(item.book.price, 1, 2)}"></td>
                    <td>
                        <form th:action="@{/cart/update}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}"/>
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" style="width: 60px; display:inline-block;"/>
                            <button type="submit">Update</button>
                        </form>
                    </td>
                    <td th:text="${#numbers.formatDecimal(item.book.price * item.quantity, 1, 2)}"></td> 
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}"/>
                            <button type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            Total: ₹<span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}"></span>
        </div>

        <div class="actions">
            <a th:href="@{/books}">Continue Shopping</a>
            <a th:href="@{/checkout}">Proceed to Checkout</a>
            <a th:href="@{/cart/clear}" style="color: red;">Clear Cart</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <input type="submit" value="Logout"/>
            </form>
        </div>
    </div>
</body>
</html>
