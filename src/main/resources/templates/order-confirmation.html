<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
	<!--<script>
		        setTimeout(function() {
		            window.location.href = '/cart';
		        }, 3000); // Redirect after 3 seconds (adjust as needed)
		    </script>-->
	<style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .confirmation-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #28a745; /* Green for success */
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 10px;
            color: #555;
            line-height: 1.6;
        }

        strong {
            font-weight: bold;
        }

        .order-details {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: left;
        }

        .items-list {
            list-style: none;
            padding: 0;
        }

        .items-list li {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .items-list li:last-child {
            border-bottom: none;
        }

        .actions {
            margin-top: 30px;
        }

        .actions a {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
            margin: 0 10px;
        }

        .actions a:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: #dc3545; /* Red for error */
            margin-top: 20px;
            font-weight: bold;
        }
		.actions button {
		           display: inline-block;
		           padding: 10px 20px;
		           text-decoration: none;
		           background-color: #007bff;
		           color: #fff;
		           border-radius: 5px;
		           margin: 10px;
		           border: none;
		           cursor: pointer;
		       }

		       .actions button:hover {
		           background-color: #0056b3;
		       }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h1 th:if="${order}">Order Confirmation</h1>
        <h1 th:if="${error}" class="error-message">Order Failed</h1>

        <div th:if="${order}">
            <p>Your order has been successfully placed!</p>
            <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Order Date:</strong> <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span></p>
            <p><strong>Payment Date:</strong> <span th:text="${#temporals.format(order.paymentDate, 'dd-MM-yyyy')}"></span></p>
            <p><strong>Total Price:</strong> $<span th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)}"></span></p>

            <div class="order-details">
                <h3>Items Purchased:</h3>
                <ul class="items-list">
                    <li th:each="item : ${order.items}">
                        <span th:text="${item.bookName}"></span> - Quantity: <span th:text="${item.quantity}"></span> - Price: $<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></span>
                    </li>
                </ul>
            </div>

            <p>Thank you for shopping with us!</p>

           <!-- <div class="actions">
               
                <a th:href="@{/cart}">Go to Home</a>
            </div>-->
			
			
			<a th:href="@{/books/home}">Continue Shopping</a> </div>
       

        <div th:if="${error}">
            <p th:text="${error}"></p>
            <div class="actions">
                <a th:href="@{/cart}">Back to Cart</a>
                <a th:href="@{/books}">Go to Home</a>
            </div>
        </div>
    </div>		<script>
		    document.addEventListener('DOMContentLoaded', function() {
		        const clearCartButton = document.getElementById('clearCartButton');
		        if (clearCartButton) {
		            clearCartButton.addEventListener('click', function() {
		                fetch('/cart/clear-cart-frontend', {
		                    method: 'POST',
		                    headers: {
		                        'Content-Type': 'application/json',
		                        // Include CSRF token if enabled
		                    }
		                })
		                .then(response => {
		                    if (response.ok) {
		                        window.location.href = '/books'; // Redirect on success
		                    } else {
		                        console.error('Failed to clear cart');
		                        // Optionally display an error message to the user
		                    }
		                })
		                .catch(error => {
		                    console.error('Error clearing cart:', error);
		                    // Optionally display an error message to the user
		                });
		            });
		        }
		    });
		</script>

		</body>
		</html>
