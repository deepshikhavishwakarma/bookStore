<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Add New Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #3498db;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #3498db;
        }

        a:hover {
            text-decoration: underline;
        }

        .denied {
            text-align: center;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container" sec:authorize="hasRole('ADMIN')">
    <h1>Add New Book</h1>
    <form th:action="@{/books/save}" th:object="${book}" method="post">
        <div>
            <label for="bookName">Book Name:</label>
            <input type="text" id="bookName" th:field="*{bookName}" required />
        </div>
        <div>
            <label for="authorName">Author Name:</label>
            <input type="text" id="authorName" th:field="*{authorName}" required />
        </div>
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" th:field="*{quantity}" required />
        </div>
        <div>
            <label for="price">Price:</label>
            <input type="number" step="0.01" id="price" th:field="*{price}" required />
        </div>
        <button type="submit">Save Book</button>
    </form>
    <p style="text-align: center;"><a th:href="@{/books}">Back to Book List</a></p>
</div>

</body>
</html>
