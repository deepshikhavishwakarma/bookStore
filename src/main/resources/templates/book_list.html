<!DOCTYPE html>
<!--<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">-->
	  <html xmlns:th="http://www.thymeleaf.org"
	        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Book List</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa;
        }
        h1, h2, h3, .navbar-brand {
            font-family: 'Montserrat', sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-success:hover {
            background-color: #1e7e34;
            border-color: #1e7e34;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #c82333;
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
            color: #212529;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/books}">My Bookstore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books/showNewForm}">Add New Book</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cart}">View Cart <span class="badge bg-secondary" th:if="${cartItemCount > 0}" th:text="${cartItemCount}">0</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/order/get/orders}">Orders </a>
                    </li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-flex">
                    <button type="submit" class="btn btn-outline-danger">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4">Available Books</h1>
		<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
		       <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

			   <p sec:authorize="hasRole('ADMIN')">
			              <a th:href="@{/books/showNewForm}" class="btn btn-primary">Add New Book</a>
			          </p>
        <div class="mb-3">
            <form th:action="@{/books/search}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <input type="text" class="form-control" name="keyword" placeholder="Enter book name or author"/>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-success">Search</button>
                </div>
            </form>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="book : ${listBooks}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${book.bookName}">Book Title</h5>
                        <h6 class="card-subtitle mb-2 text-muted" th:text="${book.authorName}">Author Name</h6>
                        <p class="card-text">Quantity: <span th:text="${book.quantity}"></span></p>
                        <p class="card-text">Price: <span th:text="${#numbers.formatDecimal(book.price, 1, 2)}"></span></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <a th:href="@{/books/showFormForUpdate/{id}(id=${book.bookId})}" class="btn btn-sm btn-warning">Update</a>
                                <span style="margin: 0 5px;">|</span>
                                <a th:href="@{/books/delete/{id}(id=${book.bookId})}" class="btn btn-sm btn-danger">Delete</a>
                            </div>
                            <form th:action="@{/cart/add}" method="post" class="add-to-cart-form">
                                <input type="hidden" name="bookId" th:value="${book.bookId}"/>
                                <input type="number" class="form-control form-control-sm" name="quantity" value="1" min="1" style="width: 60px; display: inline-block; margin-right: 5px;"/>
                                <button type="submit" class="btn btn-sm btn-success"><i class="fas fa-shopping-cart"></i> Add to Cart</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</body>
</html>
